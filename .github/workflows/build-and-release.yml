name: Build and Release HDrive

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify Account Serialization
        run: dotnet run --project windows/tests/AccountSerialization/AccountSerialization.csproj -c Release
      - name: Verify Accounts, Transfers, OAuth and S3
        run: dotnet run --project windows/tests/CoreRegression/CoreRegression.csproj -c Release

  build-windows:
    needs: core-regression
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HDRIVE_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows App
        run: dotnet publish windows/HDriveWin/HDriveWin.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:WindowsAppSDKSelfContained=true -o windows/HDriveWin/publish_x64
      - name: Sign Windows App
        shell: pwsh
        run: ./windows/sign-release.ps1 -PublishDirectory ./windows/HDriveWin/publish_x64 -RequireSignature:($env:HDRIVE_REQUIRE_SIGNING -eq 'true')
      - name: Verify Windows App Opens Its Main Window
        shell: pwsh
        run: ./windows/test-startup.ps1 -ExePath ./windows/HDriveWin/publish_x64/HDrive.exe -ReportDirectory ./windows/startup-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v1.2.7 Account Migration and Restart
        shell: pwsh
        run: ./windows/test-startup-upgrade.ps1 -ExePath ./windows/HDriveWin/publish_x64/HDrive.exe -VerifyMigration
      - name: Upload Windows Startup Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HDrive-Windows-Startup
          path: |
            windows/startup-report/
            windows/upgrade-report/
          if-no-files-found: ignore
      - name: Build Windows Setup Installer
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          ./windows/sign-release.ps1 -InstallerPath ./windows/Output/HDrive-Setup.exe -RequireSignature:($env:HDRIVE_REQUIRE_SIGNING -eq 'true')
          Copy-Item windows/Output/HDrive-Setup.exe ./HDrive-Setup.exe
      - name: Package Windows Portable Binary
        shell: pwsh
        run: Compress-Archive -Path windows/HDriveWin/publish_x64/* -DestinationPath HDrive-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HDrive-Windows
          path: |
            HDrive-Setup.exe
            HDrive-Windows-x64.zip

  build-macos:
    needs: core-regression
    runs-on: macos-14
    timeout-minutes: 25
    env:
      HDRIVE_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') }}
      MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Account and Storage Regressions
        run: bash macOS/test-regressions.sh
      - name: Verify iOS Storage Client Regressions
        run: HDRIVE_TEST_CLIENT=iOS/HDrive/Models/WebDAVClient.swift HDRIVE_TEST_OUTPUT=build/ios-client-regression bash macOS/test-regressions.sh
      - name: Build Universal macOS App
        run: bash macOS/build-macos.sh
      - name: Sign macOS App with Developer ID
        run: bash macOS/sign-release.sh sign build/macos/HDrive.app
      - name: Create DMG
        run: hdiutil create -volname HDrive -srcfolder build/macos/HDrive.app -ov -format UDZO HDrive-macOS.dmg
      - name: Notarize and Staple
        run: bash macOS/sign-release.sh notarize build/macos/HDrive.app HDrive-macOS.dmg
      - name: Create ZIP
        run: ditto -c -k --keepParent build/macos/HDrive.app HDrive-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HDrive-macOS
          path: |
            HDrive-macOS.dmg
            HDrive-macOS.zip

  build-ios:
    needs: core-regression
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator App
        run: xcodebuild -project iOS/HDrive.xcodeproj -scheme HDrive -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  release:
    needs: [build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HDrive-Windows
      - uses: actions/download-artifact@v4
        with:
          name: HDrive-macOS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HDrive ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            HDrive-Setup.exe
            HDrive-Windows-x64.zip
            HDrive-macOS.dmg
            HDrive-macOS.zip
