name: Build and Release HDrive

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the built packages as a GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag matching the source version (for example v1.4.6)'
        type: string
        default: ''
      allow_unsigned_release:
        description: 'Explicitly authorize distribution without signing/notarization'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core-regression:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release-plan.outputs.publish }}
      tag: ${{ steps.release-plan.outputs.tag }}
      unsigned: ${{ steps.release-plan.outputs.unsigned }}
      require_signing: ${{ steps.release-plan.outputs.require_signing }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Release Request and Version
        id: release-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned_release }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, re, xml.etree.ElementTree as ET
          manual = os.environ['EVENT_NAME'] == 'workflow_dispatch' and os.environ['PUBLISH_RELEASE'] == 'true'
          tagged = os.environ['REF'].startswith('refs/tags/v')
          publish = manual or tagged
          unsigned = manual and os.environ['ALLOW_UNSIGNED'] == 'true'
          if manual and os.environ['REF'] != 'refs/heads/main':
              raise SystemExit('Manual releases must run from main.')
          tag = os.environ['RELEASE_TAG'] if manual else os.environ['REF_NAME'] if tagged else ''
          if publish:
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
                  raise SystemExit('Expected a stable release tag such as v1.4.6.')
              version = tag[1:]
              mac = plistlib.loads(pathlib.Path('macOS/Info.plist').read_bytes())['CFBundleShortVersionString']
              windows = ET.parse('windows/HDriveWin/HDriveWin.csproj').findtext('./PropertyGroup/Version')
              installer = re.search(r'#define MyAppVersion "([^"]+)"', pathlib.Path('windows/installer.iss').read_text()).group(1)
              ios = re.findall(r'MARKETING_VERSION = ([^;]+);', pathlib.Path('iOS/HDrive.xcodeproj/project.pbxproj').read_text())
              if not ios or any(value != version for value in [mac, windows, installer, *ios]):
                  raise SystemExit('Release tag and application versions do not match.')
              if not pathlib.Path('docs/releases', tag + '.md').is_file():
                  raise SystemExit('Release notes are missing.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'publish': str(publish).lower(), 'tag': tag, 'unsigned': str(unsigned).lower(), 'require_signing': str(publish and not unsigned).lower()}.items():
                  output.write(f'{key}={value}\n')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify Account Serialization
        run: dotnet run --project windows/tests/AccountSerialization/AccountSerialization.csproj -c Release
      - name: Verify Accounts, Transfers, OAuth and S3
        run: dotnet run --project windows/tests/CoreRegression/CoreRegression.csproj -c Release

  build-windows:
    needs: core-regression
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HDRIVE_REQUIRE_SIGNING: ${{ needs.core-regression.outputs.require_signing }}
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows App
        run: dotnet publish windows/HDriveWin/HDriveWin.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:WindowsAppSDKSelfContained=true -o windows/HDriveWin/publish_x64
      - name: Sign Windows App
        shell: pwsh
        run: ./windows/sign-release.ps1 -PublishDirectory ./windows/HDriveWin/publish_x64 -RequireSignature:($env:HDRIVE_REQUIRE_SIGNING -eq 'true')
      - name: Verify Windows App Opens Its Main Window
        shell: pwsh
        run: ./windows/test-startup.ps1 -ExePath ./windows/HDriveWin/publish_x64/HDrive.exe -ReportDirectory ./windows/startup-report
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify v1.2.7 Account Migration and Restart
        shell: pwsh
        run: ./windows/test-startup-upgrade.ps1 -ExePath ./windows/HDriveWin/publish_x64/HDrive.exe -VerifyMigration
      - name: Upload Windows Startup Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HDrive-Windows-Startup
          path: |
            windows/startup-report/
            windows/upgrade-report/
          if-no-files-found: ignore
      - name: Build Windows Setup Installer
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { choco install innosetup -y --no-progress }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          ./windows/sign-release.ps1 -InstallerPath ./windows/Output/HDrive-Setup.exe -RequireSignature:($env:HDRIVE_REQUIRE_SIGNING -eq 'true')
          Copy-Item windows/Output/HDrive-Setup.exe ./HDrive-Setup.exe
      - name: Package Windows Portable Binary
        shell: pwsh
        run: Compress-Archive -Path windows/HDriveWin/publish_x64/* -DestinationPath HDrive-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HDrive-Windows
          path: |
            HDrive-Setup.exe
            HDrive-Windows-x64.zip

  build-macos:
    needs: core-regression
    runs-on: macos-14
    timeout-minutes: 25
    env:
      HDRIVE_REQUIRE_SIGNING: ${{ needs.core-regression.outputs.require_signing }}
      MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Account and Storage Regressions
        run: bash macOS/test-regressions.sh
      - name: Verify iOS Storage Client Regressions
        run: HDRIVE_TEST_CLIENT=iOS/HDrive/Models/WebDAVClient.swift HDRIVE_TEST_OUTPUT=build/ios-client-regression bash macOS/test-regressions.sh
      - name: Build Universal macOS App
        run: bash macOS/build-macos.sh
      - name: Sign macOS App with Developer ID
        run: bash macOS/sign-release.sh sign build/macos/HDrive.app
      - name: Create DMG
        run: hdiutil create -volname HDrive -srcfolder build/macos/HDrive.app -ov -format UDZO HDrive-macOS.dmg
      - name: Notarize and Staple
        run: bash macOS/sign-release.sh notarize build/macos/HDrive.app HDrive-macOS.dmg
      - name: Create ZIP
        run: ditto -c -k --keepParent build/macos/HDrive.app HDrive-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HDrive-macOS
          path: |
            HDrive-macOS.dmg
            HDrive-macOS.zip

  build-ios:
    needs: core-regression
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS Simulator App
        run: xcodebuild -project iOS/HDrive.xcodeproj -scheme HDrive -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  release:
    needs: [core-regression, build-windows, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: needs.core-regression.outputs.publish == 'true'
    concurrency:
      group: release-${{ needs.core-regression.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HDrive-Windows
      - uses: actions/download-artifact@v4
        with:
          name: HDrive-macOS
      - name: Prepare Release Notes
        env:
          RELEASE_TAG: ${{ needs.core-regression.outputs.tag }}
          UNSIGNED_RELEASE: ${{ needs.core-regression.outputs.unsigned }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          notes = pathlib.Path('docs/releases', os.environ['RELEASE_TAG'] + '.md').read_text()
          if os.environ['UNSIGNED_RELEASE'] == 'true':
              notes += '\n\n**Dağıtım imzası:** Bu sürüm kullanıcı onayıyla imzasız yayımlanmıştır. macOS paketi Apple tarafından notarize edilmemiştir. Windows ve macOS güvenlik uyarısı gösterebilir.\n'
          pathlib.Path('RELEASE_NOTES.md').write_text(notes)
          PY
      - uses: softprops/action-gh-release@v2
        id: release-upload
        with:
          tag_name: ${{ needs.core-regression.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HDrive ${{ needs.core-regression.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            HDrive-Setup.exe
            HDrive-Windows-x64.zip
            HDrive-macOS.dmg
            HDrive-macOS.zip
      - name: Verify Packages and Publish Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.release-upload.outputs.id }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const release_id = Number(process.env.RELEASE_ID);
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id });
            for (const name of ['HDrive-Setup.exe', 'HDrive-Windows-x64.zip', 'HDrive-macOS.dmg', 'HDrive-macOS.zip']) {
              const asset = release.assets.find(asset => asset.name === name && asset.state === 'uploaded');
              const bytes = fs.readFileSync(name);
              const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
              if (!asset || asset.size !== bytes.length || asset.digest !== digest) {
                throw new Error('Uploaded package verification failed: ' + name);
              }
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id, draft: false, prerelease: false, make_latest: 'true' });
            core.notice('Published ' + release.html_url);
