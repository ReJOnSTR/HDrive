name: Build and Release HDrive

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. Windows (WinUI 3 / .NET 8 Self-Contained) Derleme
  # -----------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows App (WinUI 3 x64)
        run: |
          cd windows/HDriveWin
          dotnet publish -c Release -p:Platform=x64 -r win-x64 --self-contained -p:PublishSingleFile=false -o publish_x64

      - name: Build Windows Setup Installer (HDrive-Setup.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss

      - name: Package Windows Portable Binary
        shell: pwsh
        run: |
          Compress-Archive -Path windows/HDriveWin/publish_x64/* -DestinationPath HDrive-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HDrive-Windows
          path: |
            windows/Output/HDrive-Setup.exe
            HDrive-Windows-x64.zip

  # -----------------------------------------------------------
  # 2. macOS (Native Apple Silicon / Universal) Derleme
  # -----------------------------------------------------------
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build macOS App
        run: |
          mkdir -p macOS/HDrive.app/Contents/MacOS
          mkdir -p macOS/HDrive.app/Contents/Resources
          cp macOS/Info.plist macOS/HDrive.app/Contents/Info.plist 2>/dev/null || true

          swiftc -parse-as-library \
            iOS/HDrive/Models/FileItem.swift \
            iOS/HDrive/Models/ServerConfig.swift \
            iOS/HDrive/Models/NetworkUtils.swift \
            iOS/HDrive/Server/BonjourPublisher.swift \
            iOS/HDrive/Server/WebDAVHandler.swift \
            iOS/HDrive/Server/WebDAVServer.swift \
            iOS/HDrive/Server/WebDashboardEmbeddedAssets.swift \
            macOS/HDriveMac/Services/WebDAVClient.swift \
            macOS/HDriveMac/Services/CloudreveManager.swift \
            macOS/HDriveMac/Services/DriveMounter.swift \
            macOS/HDriveMac/Services/FolderSyncEngine.swift \
            macOS/HDriveMac/Services/BonjourBrowser.swift \
            macOS/HDriveMac/Services/FileOpener.swift \
            macOS/HDriveMac/Views/NativeExplorerView.swift \
            macOS/HDriveMac/HDriveMacApp.swift \
            -o "macOS/HDrive.app/Contents/MacOS/HDrive"

      - name: Create DMG & ZIP
        run: |
          hdiutil create -volname "HDrive" -srcfolder macOS/HDrive.app -ov -format UDZO HDrive-macOS.dmg
          zip -r -y HDrive-macOS.zip macOS/HDrive.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HDrive-macOS
          path: |
            HDrive-macOS.dmg
            HDrive-macOS.zip

  # -----------------------------------------------------------
  # 3. Otomatik GitHub Release Yayınlama
  # -----------------------------------------------------------
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Builds
        uses: actions/download-artifact@v4
        with:
          name: HDrive-Windows

      - name: Download macOS Builds
        uses: actions/download-artifact@v4
        with:
          name: HDrive-macOS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: HDrive ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## 🚀 HDrive Kurulum Paketleri

            Tüm platformlar için sorunsuz çalışan hazır kurulum paketleri:

            - 🪟 **Windows (WinUI 3 / x64)**:
              - [HDrive-Setup.exe](HDrive-Setup.exe) (⭐️ **Önerilen Windows Kurulum Programı** - Çift tıklayıp kurun, Başlat menüsü ve Masaüstü kısayollarını otomatik oluşturur)
              - [HDrive-Windows-x64.zip](HDrive-Windows-x64.zip) (Taşınabilir / Portatif zip sürümü)

            - 🍎 **macOS (Apple Silicon & Intel)**:
              - [HDrive-macOS.dmg](HDrive-macOS.dmg) (Apple Disk İmajı - Açıp Uygulamalar klasörüne sürükleyin)
              - [HDrive-macOS.zip](HDrive-macOS.zip) (Taşınabilir macOS Uygulaması)
          files: |
            HDrive-Setup.exe
            HDrive-Windows-x64.zip
            HDrive-macOS.dmg
            HDrive-macOS.zip
