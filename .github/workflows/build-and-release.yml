name: Build and Release HDrive

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. Windows (WinUI 3 / .NET 8 Self-Contained) Derleme
  # -----------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows App (WinUI 3 x64)
        run: |
          cd windows/HDriveWin
          dotnet publish -c Release -p:Platform=x64 -r win-x64 --self-contained -p:PublishSingleFile=false -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:WindowsAppSDKSelfContained=true -o publish_x64

      - name: Verify Account Serialization
        run: dotnet run --project windows/tests/AccountSerialization/AccountSerialization.csproj -c Release

      - name: Verify Windows App Opens Its Main Window
        shell: pwsh
        run: |
          ./windows/test-startup.ps1 -ExePath ./windows/HDriveWin/publish_x64/HDrive.exe -ReportDirectory ./windows/startup-report

      - name: Setup Python for Upgrade Fixture
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify v1.2.7 Account Migration and Restart
        shell: pwsh
        run: |
          ./windows/test-startup-upgrade.ps1 -ExePath ./windows/HDriveWin/publish_x64/HDrive.exe -VerifyMigration

      - name: Upload Windows Startup Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HDrive-Windows-Startup
          path: |
            windows/startup-report/
            windows/upgrade-report/
          if-no-files-found: ignore

      - name: Build Windows Setup Installer (HDrive-Setup.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss
          Copy-Item windows/Output/HDrive-Setup.exe ./HDrive-Setup.exe

      - name: Package Windows Portable Binary
        shell: pwsh
        run: |
          Compress-Archive -Path windows/HDriveWin/publish_x64/* -DestinationPath HDrive-Windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HDrive-Windows
          path: |
            HDrive-Setup.exe
            HDrive-Windows-x64.zip

  # -----------------------------------------------------------
  # 2. macOS (Native Apple Silicon / Universal) Derleme
  # -----------------------------------------------------------
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build macOS App
        run: |
          mkdir -p macOS/HDrive.app/Contents/MacOS
          mkdir -p macOS/HDrive.app/Contents/Resources
          cp macOS/Info.plist macOS/HDrive.app/Contents/Info.plist 2>/dev/null || true
          cp macOS/AppIcon.icns macOS/HDrive.app/Contents/Resources/AppIcon.icns 2>/dev/null || true

          swiftc -parse-as-library \
            iOS/HDrive/Models/FileItem.swift \
            iOS/HDrive/Models/ServerConfig.swift \
            iOS/HDrive/Models/NetworkUtils.swift \
            iOS/HDrive/Models/KeychainHelper.swift \
            iOS/HDrive/Models/NetworkMonitor.swift \
            iOS/HDrive/Models/SyncLogManager.swift \
            iOS/HDrive/Server/BonjourPublisher.swift \
            iOS/HDrive/Server/WebDAVHandler.swift \
            iOS/HDrive/Server/WebDAVServer.swift \
            iOS/HDrive/Server/WebDashboardEmbeddedAssets.swift \
            macOS/HDriveMac/Services/WebDAVClient.swift \
            macOS/HDriveMac/Services/CloudreveManager.swift \
            macOS/HDriveMac/Services/TransferManager.swift \
            macOS/HDriveMac/Services/BonjourBrowser.swift \
            macOS/HDriveMac/Services/FileOpener.swift \
            macOS/HDriveMac/Services/FilePreviewManager.swift \
            macOS/HDriveMac/Services/FileIconProvider.swift \
            macOS/HDriveMac/Views/TransferPopoverView.swift \
            macOS/HDriveMac/Views/NativeExplorerView.swift \
            macOS/HDriveMac/HDriveMacApp.swift \
            -o "macOS/HDrive.app/Contents/MacOS/HDrive"

      - name: Create DMG & ZIP
        run: |
          hdiutil create -volname "HDrive" -srcfolder macOS/HDrive.app -ov -format UDZO HDrive-macOS.dmg
          zip -r -y HDrive-macOS.zip macOS/HDrive.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HDrive-macOS
          path: |
            HDrive-macOS.dmg
            HDrive-macOS.zip

  # -----------------------------------------------------------
  # 3. Otomatik GitHub Release Yayınlama
  # -----------------------------------------------------------
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Builds
        uses: actions/download-artifact@v4
        with:
          name: HDrive-Windows

      - name: Download macOS Builds
        uses: actions/download-artifact@v4
        with:
          name: HDrive-macOS

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: HDrive ${{ github.ref_name || 'v1.0.0' }}
          fail_on_unmatched_files: true
          body: |
            v1.2.7 hesaplarının taşınması sırasında oluşan Windows açılış hatası düzeltildi.

            - Ana pencere başlatılamazsa hata bildirildikten sonra uygulama başarısız çıkış koduyla kapanır.
            - Windows paketlerine `diagnose-windows.ps1` eklendi; açılış durumunu, hata kayıtlarını ve ilgili Windows olaylarını toplar.
            - Windows paketi yayınlanmadan önce ana pencerenin açılması ve açık kalması otomatik olarak kontrol edilir.
            - Hesapların kayıt işlemi arayüz alanlarını değerlendirmez; v1.2.7 hesap geçişi ve yeniden açılış da yayın öncesinde test edilir.

            **İndirmeler**

            - [Windows x64 kurulum programı](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/HDrive-Setup.exe)
            - [Windows x64 taşınabilir paket](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/HDrive-Windows-x64.zip) — ZIP'in tüm içeriğini aynı klasöre çıkarın.
            - [macOS DMG](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/HDrive-macOS.dmg)
            - [macOS ZIP](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/HDrive-macOS.zip)
          files: |
            HDrive-Setup.exe
            HDrive-Windows-x64.zip
            HDrive-macOS.dmg
            HDrive-macOS.zip
